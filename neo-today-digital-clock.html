<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VICTORY NEO | TODAY</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#17212b;font-family:Arial,'Noto Sans JP',sans-serif} .neo-today{max-width:850px;margin:auto;padding:26px 18px 28px;text-align:center;position:relative;overflow:hidden;background:linear-gradient(180deg,#fff 0%,#f8fbff 100%)}.neo-today:before,.neo-today:after{content:"";position:absolute;height:1px;width:100%;left:0;background:linear-gradient(90deg,transparent,#65b6ed,transparent)}.neo-today:before{top:0}.neo-today:after{bottom:0}.brand{font-size:12px;font-weight:800;letter-spacing:.34em}.eyebrow{font-size:10px;letter-spacing:.4em;color:#6487a4;margin-top:8px}.date{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:17px;font-variant-numeric:tabular-nums;white-space:nowrap}.year{font-size:clamp(16px,3.4vw,26px);font-weight:500;color:#5a7183}.monthday{font-size:clamp(46px,12vw,88px);font-weight:800;letter-spacing:-.055em;line-height:1.08}.slash{font-size:clamp(25px,6vw,45px);font-weight:300;color:#6cadd6}.weekday{margin-top:11px;display:flex;justify-content:center;align-items:center;gap:14px}.en{font-size:clamp(14px,3vw,22px);font-weight:800;letter-spacing:.24em}.jp{font-size:13px;font-weight:700;color:#5884a1;padding:5px 9px;border:1px solid #b5d7ed;border-radius:3px}.clock{margin-top:17px;font-size:clamp(31px,8vw,55px);font-weight:700;letter-spacing:.055em;font-variant-numeric:tabular-nums;color:#183b58;line-height:1.2}.clock .colon{color:#65b6ed;animation:blink 1s steps(1,end) infinite}.timezone{margin-top:4px;font-size:10px;letter-spacing:.32em;color:#6487a4}@keyframes blink{50%{opacity:.35}}.accent{width:110px;height:2px;background:linear-gradient(90deg,transparent,#64b8f3,transparent);margin:18px auto 0;animation:glow 3s ease-in-out infinite}@keyframes glow{50%{opacity:.35;transform:scaleX(.7)}}@media(prefers-reduced-motion:reduce){.accent,.clock .colon{animation:none}}@media(max-width:350px){.date{gap:5px}.neo-today{padding-left:8px;padding-right:8px}}
</style>
</head>
<body>
<section class="neo-today" aria-label="本日の日付・曜日・現在時刻">
<div class="brand">VICTORY NEO</div><div class="eyebrow">TODAY</div>
<div class="date"><span class="year" id="year">----</span><span class="monthday" id="month">--</span><span class="slash">/</span><span class="monthday" id="day">--</span></div>
<div class="weekday"><span class="en" id="weekday-en">LOADING</span><span class="jp" id="weekday-jp">--曜日</span></div>
<div class="clock" role="timer" aria-label="現在の日本時間"><span id="hour">--</span><span class="colon">:</span><span id="minute">--</span><span class="colon">:</span><span id="second">--</span></div><div class="timezone">JAPAN STANDARD TIME · JST</div>
<div class="accent" aria-hidden="true"></div>
</section>
<script>
(()=>{
const $=id=>document.getElementById(id);
const en=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
const jp=['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];
function update(){
 const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
 const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));
 const weekday=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday);
 $('year').textContent=p.year+'.';$('month').textContent=p.month;$('day').textContent=p.day;
 $('hour').textContent=p.hour;$('minute').textContent=p.minute;$('second').textContent=p.second;
 $('weekday-en').textContent=en[weekday];$('weekday-jp').textContent=jp[weekday];
 $('weekday-en').style.color=weekday===0?'#c94a55':weekday===6?'#277cb8':'#182d40';
}
update();setInterval(update,250);document.addEventListener('visibilitychange',()=>{if(!document.hidden)update()});
})();
</script>
</body>
</html>
