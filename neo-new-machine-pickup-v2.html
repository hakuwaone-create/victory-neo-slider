<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VICTORY NEO | NEW MACHINE PICKUP</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#142d40;font-family:Arial,"Noto Sans JP",sans-serif}body{padding:9px 8px}.app{max-width:650px;margin:auto;text-align:center}.brand{font-size:10px;letter-spacing:.35em;font-weight:900;color:#5d8198}.title{margin:4px 0 3px;font-size:clamp(20px,5vw,28px);font-weight:900;letter-spacing:.07em}.subtitle{margin:0 0 10px;color:#718899;font-size:12px}.stage{height:390px;position:relative;overflow:hidden;isolation:isolate;border:1px solid #d4e2ed;border-radius:15px;background:radial-gradient(ellipse at 50% 42%,#fff 0%,#f2f9fd 62%,#e8f2f8 100%);display:grid;place-items:center;transition:border-color .25s,box-shadow .25s}.stage.running{border-color:#70c6f1;box-shadow:inset 0 0 28px #73d8ff38}.corner,.count{position:absolute;top:12px;font-size:10px;letter-spacing:.1em;font-weight:800;color:#648399;z-index:5}.corner{left:12px}.count{right:12px}.machine-link{display:grid;place-items:center;width:94%;height:326px;margin-top:22px;position:relative;z-index:1;text-decoration:none;cursor:pointer}.machine-link.inactive{pointer-events:none;cursor:default}.machine-link:focus-visible{outline:3px solid #218bce;outline-offset:3px;border-radius:8px}.machine{display:block;width:100%;height:100%;object-fit:contain;object-position:center center;position:relative;z-index:1;filter:drop-shadow(0 12px 13px #183d5429)}.machine[hidden],.placeholder[hidden],.detail-hint[hidden]{display:none}.placeholder{font-size:14px;font-weight:700;color:#6d899d;padding:12px}.shade{position:absolute;inset:0;background:#071522;opacity:0;z-index:2;pointer-events:none}.beam{position:absolute;top:-40%;bottom:-40%;left:-45%;width:36%;transform:translateX(-120%) rotate(17deg);background:linear-gradient(90deg,transparent,#5bbcff4d 25%,#fff 52%,#67d5ffb3 70%,transparent);filter:blur(6px);opacity:0;z-index:3;pointer-events:none}.burst{position:absolute;inset:0;background:radial-gradient(circle at center,#fff 0%,#e5faff 20%,#79d8ff9c 40%,transparent 70%);opacity:0;z-index:4;pointer-events:none}.stage.dark .shade{animation:darken .31s ease-in-out both}.stage.light .beam{animation:beam .46s ease-out both}.stage.light .shade{opacity:.36;transition:opacity .22s}.stage.reveal .burst{animation:burst .68s ease-out both}.stage.reveal .machine{animation:pop .7s cubic-bezier(.16,1.4,.35,1) both}.stage.reveal{box-shadow:inset 0 0 35px #9ee4ff80,0 0 0 1px #a5e7ff}.stage.spinning .machine{filter:drop-shadow(0 9px 14px #238db34d)}@keyframes darken{0%{opacity:0}42%{opacity:.82}100%{opacity:.48}}@keyframes beam{0%{transform:translateX(-120%) rotate(17deg);opacity:0}12%{opacity:1}85%{opacity:1}100%{transform:translateX(550%) rotate(17deg);opacity:0}}@keyframes burst{0%{opacity:.95}100%{opacity:0}}@keyframes pop{0%{opacity:.3;transform:scale(.68)}58%{opacity:1;transform:scale(1.09)}100%{opacity:1;transform:scale(1)}}.status{height:27px;margin:8px 0 5px;font-size:12px;letter-spacing:.12em;font-weight:900;color:#236282}.action{display:block;width:100%;min-height:52px;border:0;border-radius:10px;background:linear-gradient(115deg,#102b41,#236786);color:white;font-size:17px;font-weight:900;letter-spacing:.16em;cursor:pointer;box-shadow:0 4px 0 #0b2538}.action:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #0b2538}.action:disabled{opacity:.68;cursor:wait}.detail-hint{font-size:11px;color:#236282;margin:0 0 8px;font-weight:700}.small{margin:12px 0 0;color:#82909b;font-size:10px;line-height:1.55}@media(max-width:390px){.stage{height:335px}.machine-link{height:275px}.title{font-size:20px}}@media(prefers-reduced-motion:reduce){.stage.dark .shade,.stage.light .beam,.stage.reveal .burst,.stage.reveal .machine{animation:none}}
</style></head><body><main class="app"><div class="brand">VICTORY NEO</div><h1 class="title">NEW MACHINE PICKUP</h1><p class="subtitle">次に出会う新台は、どれだ？</p><div class="stage" id="stage"><span class="corner">NEW ARRIVAL</span><span class="count">15 MACHINES</span><a class="machine-link inactive" id="machineLink" target="_blank" rel="noopener noreferrer" tabindex="-1" aria-disabled="true"><img class="machine" id="machine" alt="選ばれた新台の画像" hidden></a><div class="placeholder" id="placeholder">ボタンを押して、新台を発見！</div><div class="shade" aria-hidden="true"></div><div class="beam" aria-hidden="true"></div><div class="burst" aria-hidden="true"></div></div><div class="status" id="status" aria-live="polite">READY TO PICK UP</div><p class="detail-hint" id="detailHint" hidden>選ばれた機種画像をタップすると詳細ページへ ↗</p><button type="button" class="action" id="action">PICK UP!</button><p class="small">1円パチンコ7機種・20円スロット5機種・2.5円スロット3機種からランダムに紹介します。<br>遊技結果・出玉・景品・当選とは関係ありません。</p></main>
<script>
(()=>{'use strict';
const base='https://cdn.p-town.dmm.com/shop/9470/%E6%96%B0%E5%8F%B0/';
const names=[...Array.from({length:7},(_,i)=>`newp${i+1}.jpg`),...Array.from({length:5},(_,i)=>`new20s${i+1}.jpg`),...Array.from({length:3},(_,i)=>`new25s${i+1}.jpg`)];
const machineData=[
['e ソードアート・オンライン アリシゼーション','5034'],
['e 無職転生 ～異世界行ったら本気だす～','5046'],
['P転生したらスライムだった件129ver.','4890'],
['e 終末のワルキューレ','4963'],
['P少女☆歌劇 レヴュースタァライト ラッキートリガー4500','4750'],
['e EDENS ZERO ～究極LT～','5069'],
['eアクセル・ワールド','5051'],
['L 少女☆歌劇 レヴュースタァライト -The SLOT-','4706'],
['戦国コレクション6','5010'],
['Lパチスロ 炎炎ノ消防隊2','4926'],
['スマスロスーパーリオエース2','4984'],
['スマスロ ストリートファイター6','5068'],
['スマスロスーパーリオエース2','4984'],
['スマスロ ストリートファイター6','5068'],
['スマスロ痛いのは嫌なので防御力に極振りしたいと思います。','4566']
];
const urls=names.map(n=>base+n),cache=urls.map(src=>{const image=new Image();image.src=src;return image});
const stage=document.getElementById('stage'),machine=document.getElementById('machine'),placeholder=document.getElementById('placeholder'),status=document.getElementById('status'),button=document.getElementById('action'),machineLink=document.getElementById('machineLink'),detailHint=document.getElementById('detailHint');
let busy=false,last=-1,timeout=0,sequence=0;
const sleep=ms=>new Promise(resolve=>{timeout=setTimeout(resolve,ms)});
const random=()=>Math.floor(Math.random()*urls.length);
function show(i){machine.hidden=false;placeholder.hidden=true;machine.src=urls[i]}
function phase(name){stage.className='stage '+name}
function disableLink(){machineLink.removeAttribute('href');machineLink.classList.add('inactive');machineLink.tabIndex=-1;machineLink.setAttribute('aria-disabled','true');detailHint.hidden=true}
function enableLink(i){const [title,id]=machineData[i];machineLink.href='https://p-town.dmm.com/machines/'+id;machineLink.classList.remove('inactive');machineLink.tabIndex=0;machineLink.removeAttribute('aria-disabled');machineLink.setAttribute('aria-label',title+' の機種詳細を別タブで開く');machine.alt=title;detailHint.hidden=false}
function finalPick(){let i=random();if(i===last)i=(i+1+Math.floor(Math.random()*(urls.length-1)))%urls.length;return i}
async function run(){if(busy)return;busy=true;disableLink();button.disabled=true;button.textContent='SELECTING...';status.textContent='STARTING';const seq=++sequence;const selected=finalPick();const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
try{
if(!reduced){phase('running dark');await sleep(290);if(seq!==sequence)return;phase('running light');status.textContent='SCANNING NEW MACHINES';await sleep(460);if(seq!==sequence)return;phase('running spinning');
// Fast switches, then a smooth, deliberate slowdown.
const delays=[65,65,65,65,65,65,65,65,75,85,100,120,145,180,220,275,340,420];
let previous=-1;for(const ms of delays){let next=random();if(next===previous)next=(next+1)%urls.length;previous=next;show(next);await sleep(ms);if(seq!==sequence)return;}
}
show(selected);enableLink(selected);phase(reduced?'':'reveal');status.textContent='YOUR PICKUP';button.textContent='もう一度 PICK UP!';last=selected;
}catch(e){status.textContent='読み込みエラー';button.textContent='もう一度 PICK UP!';}
finally{busy=false;button.disabled=false;}
}
button.addEventListener('click',run);
machine.addEventListener('error',()=>{if(!busy){machine.hidden=true;disableLink();placeholder.hidden=false;placeholder.textContent='画像を読み込めませんでした。通信環境をご確認ください。'}});
window.addEventListener('pagehide',()=>{sequence++;clearTimeout(timeout)});
})();
</script></body></html>
